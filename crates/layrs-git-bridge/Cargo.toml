[package]
name = "layrs-git-bridge"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
base64 = "0.22"
blake3 = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
layrs-client-core = { path = "../layrs-client-core" }
layrs-core = { path = "../layrs-core" }
layrs-graph = { path = "../layrs-graph" }
layrs-store = { path = "../layrs-store" }
layrs-store-local = { path = "../layrs-store-local" }
serde = { workspace = true }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
layrs-weave = { path = "../layrs-weave" }
uuid = { version = "1", features = ["v4"] }
