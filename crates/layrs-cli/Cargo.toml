[package]
name = "layrs-cli"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
ctrlc = "3.5.2"
layrs-client-core = { path = "../layrs-client-core" }
layrs-core = { path = "../layrs-core" }
layrs-git-bridge = { path = "../layrs-git-bridge" }
layrs-store-local = { path = "../layrs-store-local" }
serde = { workspace = true }
serde_json = "1"

[dev-dependencies]
layrs-lens-sdk = { path = "../layrs-lens-sdk" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "layrs"
path = "src/main.rs"
