[package]
name = "layrs-store-server"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
bytes = "1"
futures-core = "0.3"
fs2 = "0.4"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
hmac = "0.12"
layrs-core = { path = "../layrs-core" }
layrs-graph = { path = "../layrs-graph" }
layrs-store = { path = "../layrs-store" }
layrs-weave = { path = "../layrs-weave" }
layrs-sync = { path = "../layrs-sync" }
serde = { workspace = true }
serde_jcs = "0.1"
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync"] }
url = "2"
zstd = "0.13"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
