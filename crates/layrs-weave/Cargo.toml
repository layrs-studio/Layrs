[package]
name = "layrs-weave"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
layrs-core = { path = "../layrs-core" }
layrs-graph = { path = "../layrs-graph" }
layrs-sync = { path = "../layrs-sync" }
blake3 = "1"
serde = { workspace = true }
serde_json = "1"
layrs-gates = { path = "../layrs-gates" }
layrs-lens-sdk = { path = "../layrs-lens-sdk" }
layrs-lens-code = { path = "../layrs-lens-code" }
layrs-lens-text = { path = "../layrs-lens-text" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmi = "=0.40.0"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
libc = "0.2"
