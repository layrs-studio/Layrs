[package]
name = "layrs-server"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
async-trait = "0.1"
argon2 = "0.5"
axum = "0.7"
base64 = "0.22"
blake3 = "1"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
fs2 = "0.4"
layrs-api = { path = "../layrs-api" }
layrs-core = { path = "../layrs-core" }
layrs-lens-code = { path = "../layrs-lens-code" }
layrs-lens-image = { path = "../layrs-lens-image" }
layrs-lens-raw = { path = "../layrs-lens-raw" }
layrs-lens-sdk = { path = "../layrs-lens-sdk" }
layrs-lens-text = { path = "../layrs-lens-text" }
layrs-store-server = { path = "../layrs-store-server" }
layrs-sync = { path = "../layrs-sync" }
serde = { workspace = true }
serde_jcs = "0.1"
serde_json = "1"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower-http = { version = "0.5", features = ["cors"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
zstd = "0.13"

[dev-dependencies]
layrs-store = { path = "../layrs-store" }
layrs-weave = { path = "../layrs-weave" }
layrs-runner = { path = "../layrs-runner" }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
layrs-client-core = { path = "../layrs-client-core" }
layrs-store-local = { path = "../layrs-store-local" }
tower = { version = "0.5", features = ["util"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
