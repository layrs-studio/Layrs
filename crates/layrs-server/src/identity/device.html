<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autoriser un appareil · Layrs</title>
<style>body{font:17px system-ui;background:#f3f4f7;color:#172033;max-width:32rem;margin:8vh auto;padding:2rem}main{background:white;border:1px solid #d6dbe5;border-radius:14px;padding:2rem}label{display:block;margin-top:1rem}input,button{box-sizing:border-box;width:100%;padding:.8rem;margin:.3rem 0;border:1px solid #9aa6bc;border-radius:6px;font:inherit}button{background:#2349af;color:white;cursor:pointer}button[disabled]{opacity:.5}#status{min-height:2rem}small{color:#49566f}[hidden]{display:none}</style>
</head><body><main><h1>Autoriser un appareil</h1><p>Saisissez le code affiché par votre CLI ou Desktop Layrs. Validez uniquement une demande que vous venez de lancer.</p>
<form id="login"><label for="account">Compte</label><input id="account" autocomplete="username" required><label for="password">Mot de passe</label><input id="password" type="password" autocomplete="current-password" required><label for="code">Code de l'appareil</label><input id="code" autocomplete="off" placeholder="ABCDE-12345" maxlength="11" required><button>Vérifier la demande</button></form>
<section id="confirmation" hidden><h2>Confirmer l'accès</h2><p id="device"></p><small>Cet appareil accèdera aux projets autorisés pour votre compte. Vous pourrez révoquer son token.</small><button id="approve">Autoriser cet appareil</button><button id="cancel">Annuler</button></section>
<p id="status" role="status" aria-live="polite"></p></main><script src="/auth/device.js" defer></script></body></html>
