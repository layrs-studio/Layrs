name: Native packaging

on:
  workflow_dispatch:
  pull_request:
    paths: ["crates/**", "Cargo.*", "rust-toolchain.toml", "scripts/*native*", "scripts/package-*", "deploy/selfhost/**", ".github/workflows/native-packaging.yml"]

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update
      - name: Verify package corruption and path rejection
        run: node --test scripts/verify-native-package.test.mjs
      - name: Build the supervised Windows Lens worker fixture
        if: runner.os == 'Windows'
        run: cargo build --locked -p layrs-weave --bin layrs-lens-worker
      - name: Native storage and CLI safety
        run: cargo test --locked -p layrs-cli --test local_data_safety -p layrs-client-core --test native_materialize_types --test native_materialize_symlinks --test native_workspace --test native_merge_accept
      - name: Build native archive with checksums
        run: node scripts/package-native.mjs --output dist/native
      - name: Exercise the packaged binaries
        shell: bash
        run: node scripts/smoke-native-package.mjs dist/native/layrs-*/
      - name: Preserve candidate artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.os }}-${{ github.sha }}
          path: |
            dist/native/*.tar.gz
            dist/native/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
