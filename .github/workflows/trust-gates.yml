name: Trust gates

on:
  pull_request:
  push:
    branches: [main, "hardening/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-postgres-web:
    name: Linux / static, PostgreSQL, Web
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.14-alpine3.23
        env:
          POSTGRES_DB: layrs_test
          POSTGRES_USER: layrs
          POSTGRES_PASSWORD: layrs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U layrs -d layrs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1

      - name: Set up Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Install pnpm
        run: npm install --global pnpm@9.15.0

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Static trust gates
        run: pnpm check

      - name: Lens package contract tests
        run: pnpm test:packages

      - name: Build supervised native Lens worker
        run: cargo build --locked -p layrs-weave --bin layrs-lens-worker

      - name: Rust workspace with mandatory PostgreSQL
        run: cargo test --workspace -- --test-threads=1
        env:
          DATABASE_URL: postgres://layrs:layrs@127.0.0.1:5432/layrs_test
          LAYRS_TEST_DATABASE_URL: postgres://layrs:layrs@127.0.0.1:5432/layrs_test
          LAYRS_TEST_DATABASE_ISOLATED: "1"
          LAYRS_REQUIRE_TEST_DATABASE: "1"
          RUST_TEST_THREADS: "1"

      - name: Install PostgreSQL and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Test native fresh install, extensions and legacy refusal
        run: pnpm test:migrations:upgrade
        env:
          LAYRS_TEST_DATABASE_URL: postgres://layrs:layrs@127.0.0.1:5432/layrs_test
          LAYRS_TEST_DATABASE_ISOLATED: "1"

      - name: Mandatory native identity, maintenance and concurrent TLS clients
        run: node scripts/test-native-postgres.mjs
        env:
          LAYRS_TEST_DATABASE_URL: postgres://layrs:layrs@127.0.0.1:5432/layrs_test
          LAYRS_TEST_DATABASE_ISOLATED: "1"

      - name: Actual Linux disk-full refusal and recovery
        run: |
          docker build --file scripts/test-linux-native.Dockerfile --tag layrs-linux-tests:validation .
          LAYRS_LINUX_CARGO_REGISTRY="$HOME/.cargo/registry" node scripts/test-linux-disk-full.mjs

      - name: Offline Linux GC quarantine, recovery and retention
        # GC uses its own disposable PostgreSQL, real dump/restore and no host CAS.
        # The script requires an actual executed test, not an ignored success.
        run: |
          docker pull postgres:17.6-bookworm
          LAYRS_LINUX_CARGO_REGISTRY="$HOME/.cargo/registry" node scripts/test-linux-gc.mjs

      - name: Renderer UI suites
        run: pnpm test:e2e:renderer

      - name: Real native Studio Web over disposable TLS and PostgreSQL
        run: node scripts/test-native-ui-ci.mjs web
        env:
          LAYRS_TEST_DATABASE_URL: postgres://layrs:layrs@127.0.0.1:5432/layrs_test
          LAYRS_TEST_DATABASE_ISOLATED: "1"

      - name: Upload Linux Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-linux-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  windows-desktop-native:
    name: Windows / Tauri native Desktop
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1

      - name: Set up Rust
        shell: pwsh
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Install pnpm
        run: npm install --global pnpm@9.15.0

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      # Packaging audits the embedded WASM guest offline from the root workspace.
      - name: Fetch Rust workspace dependencies
        run: cargo fetch --locked

      - name: Desktop typecheck
        run: pnpm --filter @layrs/studio-desktop check

      - name: Tauri shell tests
        run: pnpm test:tauri

      - name: Package Tauri Desktop
        run: node scripts/package-desktop-windows.mjs --output dist/desktop

      - name: Preserve Windows installer candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-windows-${{ github.sha }}
          path: |
            dist/desktop/*.msi
            dist/desktop/SHA256SUMS
            dist/desktop/manifest.json
          if-no-files-found: error
          retention-days: 14

      # The UI fixture waits for a running app, not a cold Rust compilation.
      - name: Precompile native Desktop harness and Lens worker
        run: |
          cargo build --locked -p layrs-weave --bin layrs-lens-worker
          cargo build --locked --manifest-path apps/studio-desktop/src-tauri/Cargo.toml --target-dir target/studio-desktop-e2e

      - name: Native Desktop UI suite
        run: node scripts/test-native-ui-ci.mjs desktop

      - name: Upload Windows Desktop evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-windows-native-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
