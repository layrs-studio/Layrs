name: Trust gates

on:
  pull_request:
  push:
    branches: [main, "hardening/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trust-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-postgres-web:
    name: Linux / static, PostgreSQL, Web
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16.14-alpine3.23
        env:
          POSTGRES_DB: layrs_test
          POSTGRES_USER: layrs
          POSTGRES_PASSWORD: layrs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U layrs -d layrs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1

      - name: Set up Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Install pnpm
        run: npm install --global pnpm@9.15.0

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Static trust gates
        run: pnpm check

      - name: Client SDK unit tests
        run: pnpm test:sdk

      - name: Rust workspace with mandatory PostgreSQL
        run: cargo test --workspace -- --test-threads=1
        env:
          DATABASE_URL: postgres://layrs:layrs@127.0.0.1:5432/layrs_test
          LAYRS_TEST_DATABASE_URL: postgres://layrs:layrs@127.0.0.1:5432/layrs_test
          LAYRS_TEST_DATABASE_ISOLATED: "1"
          LAYRS_REQUIRE_TEST_DATABASE: "1"
          RUST_TEST_THREADS: "1"

      - name: Install migration and browser prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          cargo install sqlx-cli --version 0.8.6 --locked --no-default-features --features rustls,postgres
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Create migration upgrade database
        run: PGPASSWORD=layrs psql -h 127.0.0.1 -U layrs -d postgres -c "CREATE DATABASE layrs_upgrade"

      - name: Resolve migration baseline
        shell: bash
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$EVENT_BASE" || "$EVENT_BASE" =~ ^0+$ ]]; then
            EVENT_BASE="$(git rev-parse HEAD^)"
          fi
          echo "LAYRS_MIGRATION_BASE_REF=$EVENT_BASE" >> "$GITHUB_ENV"

      - name: Test fresh-to-current migration upgrade
        run: pnpm test:migrations:upgrade
        env:
          LAYRS_TEST_DATABASE_URL: postgres://layrs:layrs@127.0.0.1:5432/layrs_upgrade
          LAYRS_TEST_DATABASE_ISOLATED: "1"

      - name: Renderer UI suites
        run: pnpm test:e2e:renderer

      - name: Real Studio Web suite
        run: pnpm test:web:ci

      - name: Upload Linux Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-linux-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  windows-desktop-native:
    name: Windows / Tauri native Desktop
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.11.1

      - name: Set up Rust
        shell: pwsh
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Install pnpm
        run: npm install --global pnpm@9.15.0

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Desktop typecheck
        run: pnpm --filter @layrs/studio-desktop check

      - name: Tauri shell tests
        run: pnpm test:tauri

      - name: Package Tauri Desktop
        run: pnpm --filter @layrs/studio-desktop tauri:build

      - name: Native Desktop UI suite
        run: pnpm test:desktop:ci

      - name: Upload Windows Desktop evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-windows-native-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
