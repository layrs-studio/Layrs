[package]
name = "layrs-studio-desktop"
version = "0.0.0"
description = "Layrs Studio desktop shell"
edition = "2021"

[workspace]

[build-dependencies]
tauri-codegen = { version = "=2.0.0" }
tauri-build = { version = "=2.0.0", features = [] }
sha2 = "0.10"

[dependencies]
blake3 = "1"
idna_adapter = { version = "=1.0.0" }
layrs-client-core = { path = "../../../crates/layrs-client-core" }
layrs-git-bridge = { path = "../../../crates/layrs-git-bridge" }
layrs-core = { path = "../../../crates/layrs-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = { version = "=3.12.0" }
serde_with_macros = { version = "=3.12.0" }
tauri = { version = "=2.0.0", features = [] }
tauri-codegen = { version = "=2.0.0" }
tauri-macros = { version = "=2.0.0" }
tauri-runtime = { version = "=2.0.0" }
tauri-runtime-wry = { version = "=2.0.0" }
tauri-utils = { version = "=2.0.0" }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }

# Keep Tauri's macOS dependency compatible with the native SCM time baseline.
[target.'cfg(target_os = "macos")'.dependencies]
plist = "=1.7.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
