name: ${LAYRS_COMPOSE_PROJECT_NAME:-layrs-dev}

services:
  postgres:
    image: ${LAYRS_POSTGRES_IMAGE:-postgres:16.14-alpine3.23}
    container_name: ${LAYRS_POSTGRES_CONTAINER_NAME:-layrs-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: layrs
      POSTGRES_USER: layrs
      POSTGRES_PASSWORD: layrs
    ports:
      - "127.0.0.1:${LAYRS_POSTGRES_PORT:-15432}:5432"
    volumes:
      - layrs-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U layrs -d layrs"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: ${LAYRS_MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z}
    container_name: ${LAYRS_MINIO_CONTAINER_NAME:-layrs-minio}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: layrs
      MINIO_ROOT_PASSWORD: layrs-local-secret
    ports:
      - "127.0.0.1:${LAYRS_MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${LAYRS_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - layrs-minio-data:/data

volumes:
  layrs-postgres-data:
  layrs-minio-data:
